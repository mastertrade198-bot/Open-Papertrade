[project]
name = "papertrade-mcp"
version = "0.1.0"
description = "MCP server for the Open Papertrade platform. Lets any MCP-speaking AI agent trade in an isolated sandbox and run benchmark tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Open Papertrade Contributors" },
]
keywords = ["mcp", "trading", "llm", "benchmark", "papertrading", "ai-agents"]

dependencies = [
    # Official MCP Python SDK. FastMCP is the ergonomic decorator API.
    "mcp[cli]>=1.2.0",
    # HTTP client for talking to the Django backend.
    "httpx>=0.27.0",
    # Env loading — reads .env from the CWD if present.
    "python-dotenv>=1.0.1",
    # Optional structured logging niceties. Falls back to stdlib logging if absent.
]

[project.scripts]
papertrade-mcp = "papertrade_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papertrade_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]         # line length is a linter's job, not a blocker

[tool.pytest.ini_options]
asyncio_mode = "auto"
